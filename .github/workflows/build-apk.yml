name: Generar APK desde ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto ZIP
        run: unzip -o "*.zip"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Capacitor y preparar proyecto Android
        run: |
          npm install
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          if [ -d "assets" ]; then npx @capacitor/assets generate --android || true; fi
          if [ -f "scripts/patch-android.mjs" ]; then node scripts/patch-android.mjs; fi

      - name: Compilar APK (Debug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-APK
          path: android/app/build/outputs/apk/debug/*.apk

        
