name: Compilar APK Nativo ClanClash

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto ZIP (si aplica)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          else
            echo "No se encontró archivo ZIP, usando archivos directos."
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a Gradle
        run: |
          # Detecta si la carpeta ClanClashApp existe y entra en ella
          if [ -d "ClanClashApp" ]; then
            cd ClanClashApp
          fi
          chmod +x gradlew

      - name: Compilar APK (Debug)
        run: |
          if [ -d "ClanClashApp" ]; then
            cd ClanClashApp
          fi
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-Nativo-APK
          path: |
            ClanClashApp/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            
