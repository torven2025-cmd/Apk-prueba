name: Generar APK ClanClash

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Descomprimir ClanClash-APK-proyecto.zip
        run: |
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          elif [ -f "package.json" ]; then
            echo "Los archivos ya estan descomprimidos en el repositorio."
          else
            echo "ERROR: No se encontro el archivo .zip en esta rama."
            exit 1
          fi

      - name: 3. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 5. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Instalar Capacitor y sincronizar proyecto
        run: |
          npm install --legacy-peer-deps
          if [ ! -d "node_modules/@capacitor/android" ]; then
            CAP_VER=$(node -p "require('./package.json').dependencies?.['@capacitor/core'] || require('./package.json').devDependencies?.['@capacitor/cli'] || 'latest'")
            npm install "@capacitor/android@$CAP_VER" --legacy-peer-deps
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "assets" ]; then
            npx @capacitor/assets generate --android || true
          fi
          if [ -f "scripts/patch-android.mjs" ]; then
            node scripts/patch-android.mjs
          fi

      - name: 7. Compilar APK Debug
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-APK
          path: android/app/build/outputs/apk/debug/*.apk
          
