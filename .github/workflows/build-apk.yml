name: Compilar APK Nativo ClanClash

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          else
            echo "No se encontró archivo ZIP, usando archivos directos."
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Buscar gradlew y compilar APK (Debug)
        run: |
          # Buscar automáticamente dónde está el archivo gradlew en el repositorio
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR CRÍTICO: No se encontró el archivo gradlew en el proyecto."
            exit 1
          fi
          
          # Obtener la carpeta exacta donde se encuentra gradlew
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Carpeta de compilación encontrada en: $GRADLE_DIR"
          
          # Entrar a la carpeta, dar permisos y compilar
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-Nativo-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
