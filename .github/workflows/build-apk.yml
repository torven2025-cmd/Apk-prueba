name: Compilar APK ClanClash 3D

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          else
            echo "No se encontró archivo ZIP, usando archivos directos."
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.7 y Compilar APK
        run: |
          # Buscar la carpeta interna del proyecto (ClanClashApp o similar)
          if [ -d "ClanClashApp" ]; then
            cd ClanClashApp
          else
            PROJECT_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
            if [ -n "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
            fi
          fi

          echo "Directorio de trabajo: $(pwd)"

          # Descargar e instalar Gradle 8.7 requerido por el proyecto
          echo "Descargando Gradle 8.7..."
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH="$(pwd)/gradle-8.7/bin:$PATH"

          # Generar el wrapper compatible con la versión 8.7
          echo "Generando Gradle Wrapper 8.7..."
          gradle wrapper --gradle-version 8.7

          # Dar permisos de ejecución y compilar el APK en modo Debug
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-3D-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
