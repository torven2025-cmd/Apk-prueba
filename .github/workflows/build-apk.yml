name: Compilar APK ClanClash 3D

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          else
            echo "No se encontró archivo ZIP, usando archivos directos."
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle y preparar compilación
        run: |
          # Actualizar e instalar gradle nativo en el entorno por si no existe gradlew
          sudo apt-get update && sudo apt-get install -y gradle

          # Buscar la carpeta interna del proyecto ClanClashApp
          if [ -d "ClanClashApp" ]; then
            cd ClanClashApp
          else
            # Búsqueda automática de la carpeta que contenga settings.gradle o build.gradle
            PROJECT_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
            if [ -n "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
            fi
          fi

          echo "Directorio de trabajo actual: $(pwd)"

          # Si no existe el archivo gradlew, lo generamos de forma automática
          if [ ! -f "gradlew" ]; then
            echo "Generando gradlew y wrapper faltantes..."
            gradle wrapper
          fi

          # Dar permisos y compilar APK Debug
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-3D-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
