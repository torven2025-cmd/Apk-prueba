name: Compilar APK Nativo ClanClash

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          else
            echo "No se encontró archivo ZIP, usando archivos directos."
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle y compilar APK (Debug)
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          
          # Buscar la carpeta del proyecto que contiene settings.gradle
          BUILD_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_DIR" ]; then
            PROJECT_DIR=$(dirname "$BUILD_DIR")
            echo "Carpeta del proyecto encontrada: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "ERROR: No se encontró la estructura de Gradle."
            exit 1
          fi

          # Si el proyecto no tiene gradlew, lo generamos automáticamente
          if [ ! -f "gradlew" ]; then
            echo "Generando gradlew faltante..."
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ClanClash-Nativo-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
